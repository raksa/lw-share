<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Local Web Share (files)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#336900">

    <link rel="stylesheet" type="text/css" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" type="text/css" href="/css/fileApp.css">
    <style>
        #qrImage {
            display: none;
            max-width: 100%;
            height: auto;
            border: 1px solid #000;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container d-flex flex-column h-100" style="overflow: hidden;">
        <div class="w-100">
            <div class="w-100" style="display: none;">
                <div id="info" class="w-100 d-flex justify-content-center flex-wrap" style="overflow: auto;"></div>
            </div>
            <div class="btn-group m-3" role="group" aria-label="Navigation Buttons">
                <a href="/" class="btn btn-outline-primary">Home</a>
                <button type="button" class="btn btn-outline-primary" onclick="toggleQR()">
                    Toggle QR
                </button>
            </div>
        </div>
        <div class="d-flex flex-grow-1 justify-content-center align-items-center" style="overflow: auto;">
            <form action="/qrCoder/" method="POST">
                <div>
                    <div class="mb-3">
                        <label for="size" class="form-label">QR Code Size</label>
                        <input type="number" class="form-control" id="size" placeholder="Size in pixels (eg. 500)">
                    </div>
                    <div class="mb-3">
                        <label for="text" class="form-label">Text for QR Code</label>
                        <textarea class="form-control" id="text" rows="3" placeholder="Enter text here..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" onclick="submitForm(event)">Generate QR Code</button>
            </form>
        </div>
        <hr>
        <div class="d-flex flex-column align-items-center">
            <h3>Generated QR Code:</h3>
            <img id="qrImage" src="" alt="QR Code">
        </div>
    </div>

    <script src="/js/qr.js"></script>
    <script src="/js/qrCoder.js"></script>
</body>

</html>
